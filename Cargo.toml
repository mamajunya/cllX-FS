[package]
name = "cllx-fs-pro"
version = "0.1.0"
edition = "2021"

[dependencies]
# Crypto
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
chacha20 = "0.9"
sha3 = "0.10"
sha2 = "0.10"
blake3 = "1.5"
hkdf = "0.12"
rand = "0.8"
rand_chacha = "0.3"
zeroize = { version = "1.7", features = ["derive"] }
pqc-ml-kem = "0.8"  # Post-quantum KEM (latest version)

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
tar = "0.4"  # For folder archiving

# Performance
rayon = "1.8"
memmap2 = "0.9"

# Utilities
thiserror = "1.0"
anyhow = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }

# GUI
eframe = "0.27"
egui = "0.27"
rfd = "0.14"  # Native file dialogs
sysinfo = "0.30"  # System information

[dev-dependencies]
criterion = "0.5"
tempfile = "3.8"

[build-dependencies]
embed-resource = "2.4"

[[bin]]
name = "cllxfs"
path = "src/bin/cllxfs.rs"

[[bin]]
name = "cllxfs-gui"
path = "src/bin/cllxfs_gui.rs"

[[bench]]
name = "chunk_crypto"
harness = false

[[bench]]
name = "performance"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
